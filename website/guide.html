<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mode d'emploi de Verso</title>
  <meta name="description" content="Mode d'emploi de Verso : installer, mettre à jour et utiliser le logiciel de projection de chants, de textes de la Bible et de PDF.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // Same rule as index.html: browser language first; a choice made on the
    // page only lasts for the visit.
    (function () {
      var saved = null;
      try { saved = sessionStorage.getItem("verso-lang"); } catch (e) {}
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
      var pick = "en";
      for (var i = 0; i < langs.length; i++) {
        var l = String(langs[i]).slice(0, 2).toLowerCase();
        if (l === "fr" || l === "en") { pick = l; break; }
      }
      document.documentElement.lang = saved === "fr" || saved === "en" ? saved : pick;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
