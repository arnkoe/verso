<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verso — Fixture Bible</title>
<link rel="stylesheet" href="../../src/assets/css/operator.css">
</head>
<body class="platform-macos">
<div class="app">
  <div class="body">
    <aside class="sidebar-left">
      <section class="card card-search">
        <div class="tabs" role="tablist">
          <button class="tab">Chants</button>
          <button class="tab active" data-testid="sidebar-active-tab">Bible</button>
          <button class="tab">PDF</button>
          <button class="tab">Images</button>
        </div>
        <div id="searchBible" style="display:flex">
          <div class="search-box">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5"/></svg>
              <input class="search-input" value="col" aria-label="Recherche Bible">
            </div>
          </div>
          <div class="content-list">
            <div class="content-item active" data-bible-ref="colossiens" data-testid="sidebar-active-row">
              <span class="item-title">Colossiens</span>
            </div>
          </div>
        </div>
      </section>
    </aside>

    <main class="main card" data-loaded="true">
      <div class="panel active" id="panelBible">
        <div class="content-header">
          <div class="content-kicker" data-testid="content-kicker">Traduction Bible du Semeur</div>
          <div class="content-header-row">
            <div class="content-title">Psaume 119</div>
            <div class="filter-pills content-header-actions">
              <button class="filter-btn active" data-testid="active-translation">BDS</button>
              <button class="filter-btn">DRB</button>
              <button class="filter-btn">LSG</button>
              <button class="filter-btn">NBS</button>
              <button class="filter-btn">S21</button>
            </div>
          </div>
        </div>
        <div class="strophe-list">
          <div class="list-item bible-verse-item">
            <div class="strophe-index">
              <div class="strophe-action"></div>
              <span class="bible-verse-number">7</span>
            </div>
            <span class="bible-verse-text">Je te louerai dans la droiture de mon cœur.</span>
          </div>
          <div class="list-item bible-verse-item">
            <div class="strophe-index">
              <div class="strophe-action"></div>
              <span class="bible-verse-number">175</span>
            </div>
            <span class="bible-verse-text">Que mon âme vive et qu’elle te loue.</span>
          </div>
          <div class="list-item bible-verse-item active" data-testid="active-verse">
            <div class="strophe-index">
              <div class="strophe-action"><span class="live-pill"></span></div>
              <span class="bible-verse-number">176</span>
            </div>
            <span class="bible-verse-text">J’ai erré comme une brebis perdue ; cherche ton serviteur.</span>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
