<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verso — Opérateur</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<script src="assets/js/platform.js"></script>
<link rel="stylesheet" href="assets/css/projection-content.css">
<link rel="stylesheet" href="assets/css/operator.css">
<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="assets/js/pdf-worker-config.js"></script>
<script src="assets/js/i18n.js"></script>
</head>
<body>
<div class="app">

  <!-- BODY -->
  <div class="body">

    <!-- SIDEBAR GAUCHE -->
    <aside class="sidebar-left">

      <section class="card card-search">
        <div class="tabs" role="tablist">
          <button class="tab active" id="tabCantiques" data-action="switchSideTab" data-arg="cantiques" role="tab" data-i18n="tab.songs">Chants</button>
          <button class="tab" id="tabBible" data-action="switchSideTab" data-arg="bible" role="tab" data-i18n="tab.bible">Bible</button>
          <button class="tab" id="tabPdf" data-action="switchSideTab" data-arg="pdf" role="tab" data-i18n="tab.pdf">PDF</button>
          <button class="tab" id="tabImages" data-action="switchSideTab" data-arg="images" role="tab" data-i18n="tab.images">Images</button>
        </div>

        <!-- Cantiques -->
        <div id="searchCantiques">
          <div class="search-box">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5"/></svg>
              <input type="text" class="search-input" id="songSearchInput" placeholder="Ex : 240" data-i18n-placeholder="search.songsPlaceholder" autocomplete="off">
              <span class="shortcut-hint" aria-hidden="true"><span data-key="mod">Ctrl</span><span class="shortcut-hint-sep">+</span><span>F</span></span>
            </div>
          </div>
          <div class="content-list" id="songList">
            <div class="search-empty search-prompt" data-i18n="search.songsEmpty">Recherchez un chant</div>
          </div>
        </div>

        <!-- Bible -->
        <div id="searchBible" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
          <div class="search-box">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5"/></svg>
              <input type="text" class="search-input" id="bibleSearchInput" placeholder="Ex : col3" data-i18n-placeholder="search.biblePlaceholder" autocomplete="off">
              <span class="shortcut-hint" aria-hidden="true"><span data-key="mod">Ctrl</span><span class="shortcut-hint-sep">+</span><span>F</span></span>
            </div>
          </div>
          <div class="content-list" id="bibleList">
            <div class="search-empty search-prompt" data-i18n="search.bibleEmpty">Recherchez un chapitre</div>
          </div>
        </div>

        <!-- PDF -->
        <div id="listPdf" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
          <div class="search-box">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5"/></svg>
              <input type="text" class="search-input" id="pdfSearchInput" placeholder="Rechercher un PDF" data-i18n-placeholder="search.pdfPlaceholder" autocomplete="off">
              <span class="shortcut-hint" aria-hidden="true"><span data-key="mod">Ctrl</span><span class="shortcut-hint-sep">+</span><span>F</span></span>
            </div>
          </div>
          <div class="content-list" id="pdfList">
            <div class="search-empty search-prompt" data-i18n="pdf.empty">Aucun PDF dans le dossier</div>
          </div>
        </div>

        <!-- Images -->
        <div id="listImages" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
          <div class="search-box">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5"/></svg>
              <input type="text" class="search-input" id="imageSearchInput" placeholder="Rechercher une image" data-i18n-placeholder="search.imagePlaceholder" autocomplete="off">
              <span class="shortcut-hint" aria-hidden="true"><span data-key="mod">Ctrl</span><span class="shortcut-hint-sep">+</span><span>F</span></span>
            </div>
          </div>
          <div class="content-list" id="imageList">
            <div class="search-empty search-prompt" data-i18n="images.empty">Aucune image dans le dossier</div>
          </div>
        </div>

        <!-- État de synchronisation des recueils (superutilisateurs) : texte
             discret au-dessus de la barre d'outils. -->
        <div id="syncStatus" class="sync-status" hidden role="status" aria-live="polite"></div>

      </section>

      <div class="action-bar" aria-hidden="true">
        <div class="action-bar-center"></div>
      </div>

      <!-- CARD : Retour projection + Contrôles -->
      <section class="card card-monitor">
        <div class="monitor-screen" id="previewMonitor">
          <div class="preview-stage" id="previewStage">
            <div class="preview-content" id="previewContent"></div>
          </div>
        </div>
        <div class="actions-bar monitor-actions" role="toolbar" aria-label="Contrôles de projection" data-i18n-aria-label="monitor.controls">
          <button class="hdr-btn" id="btnProject" data-action="openProjection" title="Ouvrir la projection sur l'écran sélectionné" data-i18n-title="monitor.projectTitle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.033 9.44a.647.647 0 0 1 0 1.12l-4.065 2.352a.645.645 0 0 1-.968-.56V7.648a.645.645 0 0 1 .967-.56z"/><path d="M12 17v4"/><path d="M8 21h8"/><rect x="2" y="3" width="20" height="14" rx="2"/></svg>
            <span data-i18n="monitor.project">Projeter</span>
            <span class="shortcut-hint" aria-hidden="true"><span data-key="mod">Ctrl</span><span class="shortcut-hint-sep">+</span><span>P</span></span>
          </button>
          <button class="hdr-btn" id="btnHideProjection" data-action="hideProjection" title="Vider la projection et afficher un écran blanc" data-i18n-title="monitor.hideTitle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 12.5-5-5"/><path d="m9.5 12.5 5-5"/><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>
            <span data-i18n="monitor.hide">Masquer</span>
            <span class="shortcut-hint" aria-hidden="true"><span data-key="mod">Ctrl</span><span class="shortcut-hint-sep">+</span><span>M</span></span>
          </button>
        </div>
      </section>

    </aside>

    <!-- ZONE CENTRALE -->
    <main class="main card">

      <div class="empty-state" id="emptyState">
        <div class="empty-state-mark" aria-hidden="true">
          <svg viewBox="100 100 824 824">
            <path d="M366 439 L512 690 L658 439" stroke-width="92"/>
            <circle cx="760" cy="264" r="74"/>
          </svg>
        </div>
        <div class="empty-state-title" data-i18n="empty.title">Aucun contenu sélectionné</div>
        <div class="empty-state-text" data-i18n="empty.text">Faites une recherche dans la barre latérale</div>
        <button class="empty-state-update" id="emptyStateUpdate" data-action="openUpdateSettings" data-i18n="update.available" hidden>Mise à jour disponible</button>
      </div>

      <!-- Panel Cantique -->
      <div class="panel active" id="panelCantique">
        <div class="content-header" id="songHeader" style="display:none;">
          <div class="content-kicker" id="songSubtitle"></div>
          <div class="content-header-row">
            <div class="content-title" id="songTitle"></div>
            <div class="content-header-actions">
              <button class="hdr-btn" id="btnEditSong" data-action="enterEditMode" title="Modifier" data-i18n-title="song.edit">
                <svg viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
                <span data-i18n="song.edit">Modifier</span>
              </button>
              <button class="hdr-btn" id="btnCancelSong" data-action="exitEditMode" title="Annuler" data-i18n-title="song.cancel" style="display:none;">
                <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                <span data-i18n="song.cancel">Annuler</span>
              </button>
              <button class="hdr-btn save" id="btnSaveSong" data-action="saveSong" title="Sauvegarder" data-i18n-title="song.save" style="display:none;">
                <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
                <span data-i18n="song.save">Sauvegarder</span>
              </button>
            </div>
          </div>
        </div>
        <div class="strophe-list" id="verseList"></div>
      </div>

      <!-- Panel Bible -->
      <div class="panel" id="panelBible">
        <div class="content-header" id="bibleHeader" style="display:none;">
          <div class="content-kicker" id="bibleSubtitle"></div>
          <!-- Boutons de traduction générés dynamiquement (voir operator.js). -->
          <div class="filter-pills content-header-actions" id="bibleTranslations"></div>
          <div class="content-header-row">
            <div class="content-title" id="bibleTitle"></div>
          </div>
        </div>
        <div class="strophe-list" id="bibleVerseList"></div>
      </div>

      <!-- Panel PDF -->
      <div class="panel" id="panelPdf">
        <div class="content-header" id="pdfHeader" style="display:none;">
          <div class="content-kicker" id="pdfSubtitle"></div>
          <div class="content-header-row">
            <div class="content-title" id="pdfTitle"></div>
          </div>
        </div>
        <div class="strophe-list" id="pdfPageList"></div>
      </div>

      <!-- Panel Images -->
      <div class="panel" id="panelImages">
        <div class="content-header" id="imageHeader" style="display:none;">
          <div class="content-kicker" id="imageSubtitle"></div>
          <div class="content-header-row">
            <div class="content-title" id="imageTitle"></div>
          </div>
        </div>
        <div class="strophe-list" id="imagePreview"></div>
      </div>

    </main>

  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/projection-render.js"></script>
<script src="assets/js/operator.js"></script>
</body>
</html>
