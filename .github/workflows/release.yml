name: Publier une version

# Workflow standard documenté par Tauri :
# https://v2.tauri.app/distribute/pipelines/github/
# Variante "release manuelle" (création de la release dissociée du build) :
# https://github.com/tauri-apps/tauri-action/blob/dev/examples/publish-to-manual-release.yml
#
# Déclenchement : pousser sur la branche `release`.
#
# Pourquoi cette variante plutôt que la matrice unique de la doc ? Avec la
# matrice unique, les trois jobs (macOS x2 + Windows) démarrent en parallèle,
# cherchent la release du tag, n'en trouvent aucune et en créent CHACUN une :
# GitHub autorise plusieurs releases draft sur le même tag. Résultat (constaté
# en 0.4.5) : deux releases concurrentes, les bundles répartis entre les deux,
# et un latest.json incomplet -> l'auto-update Windows ne voyait aucun bundle.
#
# Ici, un seul job `create-release` crée la release BROUILLON une fois et expose
# son id. Les jobs de build s'y rattachent via `releaseId` (sans toucher au
# tag), fusionnent latest.json plateforme par plateforme, puis `publish-release`
# bascule le brouillon en release publiée une fois tous les builds réussis.
on:
  push:
    branches:
      - release
  workflow_dispatch: # permet de lancer le build manuellement depuis l'onglet Actions

jobs:
  # Crée la release brouillon une seule fois et expose son id aux jobs de build.
  # La version (donc le tag) est lue dans src-tauri/tauri.conf.json, source de
  # vérité de l'app (cf. CLAUDE.md), pas dans package.json.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v5

      - name: Lire la version
        run: echo "PACKAGE_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"

      - name: Créer la release brouillon
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.PACKAGE_VERSION;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `verso-v${version}`,
              name: `Verso v${version}`,
              draft: true,
              prerelease: false,
              body: `## Quel fichier télécharger ?

            - **Windows** : le fichier qui finit par \`setup.exe\`.
            - **Mac récent (puce Apple)** : le fichier \`.dmg\` qui contient \`aarch64\`.
            - **Mac plus ancien (puce Intel)** : le fichier \`.dmg\` qui contient \`x64\`.

            Pas sûr de votre Mac ? Menu Pomme → **À propos de ce Mac**, regardez
            la ligne « Puce » ou « Processeur ».

            > Sur Windows, le premier lancement affiche un message qui fait peur.
            > **C'est normal et ce n'est pas un virus** : Verso est un logiciel
            > gratuit qui n'a pas le certificat payant de Microsoft. Voici comment
            > passer cette étape, une seule fois.

            ## Premier lancement sur Windows

            Windows peut afficher un **écran bleu** : « Windows a protégé votre
            ordinateur ». Pour continuer :

            1. Cliquez sur le petit texte **« Informations complémentaires »**.
            2. Cliquez sur le bouton **« Exécuter quand même »** qui apparaît.

            Les mises à jour suivantes s'installeront toutes seules, sans cette étape.

            ## Premier lancement sur Mac

            1. Ouvrez le fichier \`.dmg\`, puis **glissez Verso dans le dossier
               Applications**.
            2. Ouvrez Verso depuis le dossier Applications. Si le Mac demande une
               confirmation parce que l'app vient d'Internet, cliquez sur **Ouvrir**.

            Verso est signé et vérifié par Apple. Les mises à jour suivantes
            s'installeront toutes seules.

            ---

            Voir les changements ci-dessous.`,
            });
            return data.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Les recueils seeds (resources/songbooks) sont un submodule pointant
          # vers le dépôt de données verso-songbooks : sans ce checkout récursif,
          # le dossier serait vide et le build n'embarquerait aucun recueil.
          submodules: recursive

      - name: Installer Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Installer Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Cache du registre et des artefacts de compilation Rust. La clé inclut
      # plateforme + args (target) pour que les trois jobs de la matrice ne se
      # marchent pas dessus. Économise l'essentiel des minutes de compilation
      # sur les runs suivants.
      - name: Cacher Rust/cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Installer les dépendances npm
        run: npm ci

      # Signature et notarisation macOS avec le certificat « Developer ID
      # Application » du compte Apple Developer (procédure documentée par Tauri :
      # https://v2.tauri.app/distribute/sign/macos/). Le .p12 (encodé en base64
      # dans le secret APPLE_CERTIFICATE) est importé dans un trousseau
      # temporaire ; son identité est ensuite passée à tauri-action, qui signe
      # l'app puis la fait notariser par Apple (APPLE_ID / APPLE_PASSWORD /
      # APPLE_TEAM_ID). Sans notarisation, macOS bloque l'app téléchargée
      # (« Verso est endommagé »).
      - name: Importer le certificat Apple
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          # L'exemple de la doc Tauri cherche « Apple Development » (certificat
          # de développement) ; une distribution hors App Store exige
          # « Developer ID Application ». Échec explicite sinon.
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$CERT_ID" ]; then
            echo "::error::Aucun certificat « Developer ID Application » dans APPLE_CERTIFICATE."
            exit 1
          fi
          echo "CERT_ID=$CERT_ID" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé privée de signature des mises à jour (secret du dépôt).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Clé générée sans passphrase : password vide. On force la chaîne vide
          # littérale (pas de secret, GitHub interdisant les secrets vides).
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Signature et notarisation macOS (ignorées par le build Windows).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Rattache les bundles à la release brouillon créée en amont : pas de
          # tagName/releaseName ici, sinon chaque job retenterait de créer sa
          # propre release (la race condition que ce workflow corrige).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Génère et fusionne latest.json (fichier interrogé par l'updater).
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Bascule la release brouillon en publiée une fois tous les builds réussis.
  publish-release:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Basculer la release en publiée
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false,
            });
